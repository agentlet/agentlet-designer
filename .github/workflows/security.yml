name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      # The MCP server packages run through npx, so they are not in the lockfile.
      - name: Generate the MCP servers SBOM
        run: node scripts/mcp-sbom.mjs

      - name: Scan dependencies
        uses: agentlet/.github/actions/dependency-scan@13f8b012ab7b0e07229389ac7538bdab38cdb4e6 # dependency-scan-v1
        with:
          # Everything runs on the developer machine: the whole lockfile blocks.
          blocking-lockfile: 'true'
          lockfile: package-lock.json
          blocking-sbom: reports/security/sbom-mcp.cdx.json
          issue-on-failure: ${{ github.event_name == 'schedule' }}
          issue-title: 'Nightly scan: dependencies have a blocking vulnerability'
